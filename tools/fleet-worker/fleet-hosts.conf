# fleet-hosts.conf — agent -> SSH target for the live Mac minis.
#
# ONE source of truth for BOTH `shared/scripts/fleet-lock` (which mini to lock) and
# `.claude/hooks/enforce-fleet-lock.sh` (which commands target a live box). Edit here,
# not in the scripts. Override the path with $FLEET_LOCK_HOSTS_FILE if needed.
#
# Format (whitespace-separated, first match wins):
#     <agent>  <ssh-target>  [alias ...]
# Lines starting with # and blank lines are ignored. `shared/scripts/fleet-lock` (which mini it
# actually SSHes into) reads ONLY column 2, the PREFERRED ssh target — that lever is UNCHANGED by
# the alias columns below. `enforce-fleet-lock.sh` (the safety hook) matches a live-box destination
# against column 2 AND every alias in columns 3+ (case-insensitively, ignoring a user@ prefix).
#
# WHY THE ALIAS COLUMNS EXIST (ws-53, 2026-07-23 — a P1 fail-open). The hook used to attribute a
# command to an agent by matching ONLY column 2, by EXACT STRING. Every mini has several valid ssh
# spellings — a Tailscale MagicDNS name, a tailnet IP, a LAN IP — but only ONE was ever registered,
# so the SAME live box, addressed by any OTHER working spelling, attributed to NO agent at all and
# a real mutation ran with NO LOCK (verified: `ssh moxy@100.110.240.90 'zsh -lc "openclaw gateway
# restart"'` and `ssh lara@laras-mac-mini 'zsh -lc "rm -rf ~/.openclaw"'` both returned exit 0).
# Registering every spelling this file's own comments already documented as a working target closes
# that hole. It pairs with a POSITIONAL fix in the hook itself: attribution now only looks at a
# genuine ssh/scp/rsync/sftp destination argument, not every whitespace token in the command, so a
# command that merely MENTIONS a mini's address (a grep, a commit message, an echo) is no longer
# mistaken for a live-box command either.
#
# Facts sourced from docs/HANDOFF.md "FLEET ACCESS" + the WS-11/WS-12 live entries
# (2026-07-01). Prefer the stable LAN/Ethernet address; Tailscale names also work as
# an ssh target if your ~/.ssh/config maps them.
#
# ─────────────────────────────────────────────────────────────────────────────
#   agent   ssh-target              aliases
# ─────────────────────────────────────────────────────────────────────────────
# moxy moved to the Tailscale MagicDNS name 2026-07-07 (WS-23): the LAN IP 192.168.1.12 went
# unreachable mid-deploy while Tailscale stayed up, and an unreachable host makes fleet-lock
# misreport a fake "reclaim raced" / a falsely clean UNLOCKED (see .claude/agents/operator.md).
# Tailscale is also the fleet's stated access preference (CLAUDE.md → Fleet access).
moxy    moxy@moxys-mac-mini    100.110.240.90    192.168.1.12    moxy
lara    lara@100.71.124.48     laras-mac-mini    192.168.1.224    lara
chip    chip@100.89.64.86      chips-mac-mini    192.168.1.225    192.168.1.99    chip
hyper   hyper@100.70.69.110    hypers-mac-mini    192.168.1.79    hyper
#
# All four minis verified reachable via key-based SSH 2026-07-02 (chip/hyper/lara on their
# Tailscale IPs; moxy on LAN). Chip/Hyper/Lara are now LIVE hosts for lock purposes — a
# mutation targeting them requires the agent's lock (the whole point). Recovery security
# steps (SIP disable + macFUSE kext-consent) are DONE on all three — see
# docs/runbooks/mac-mini-host-setup.md § Recovery-mode security steps.
#
# Tailscale hostnames (MagicDNS) also work as ssh targets — now registered as aliases above so the
# hook can attribute them too:
#   moxy  -> moxys-mac-mini  (100.110.240.90, LAN 192.168.1.12)
#   lara  -> laras-mac-mini  (100.71.124.48)
#   chip  -> chips-mac-mini  (100.89.64.86)
#   hyper -> hypers-mac-mini (100.70.69.110, LAN 192.168.1.79)
# SHORT NAMES + REMAINING LAN IPs (2026-10-08). The bare agent names (`moxy`, `lara`, `chip`,
# `hyper`) are the ~/.ssh/config shortcuts Chanse and the coordinator actually type, and they were
# NEVER registered — so `ssh chip 'zsh -lc "openclaw gateway restart"'` attributed to no agent and
# was ALLOWED with no lock (measured with the hook in simulation, 2026-10-08), while the same
# restart via `chips-mac-mini` blocked. Same ws-53 fail-open class, on the most-used spelling.
# Also added: Lara's LAN IP 192.168.1.224 and Chip's Wi-Fi IP 192.168.1.99 (each box's own
# `ipconfig getifaddr`, 2026-10-08). LAN IPs are DHCP-assigned: if one moves, update it here AND in
# ~/.ssh/config.d/skynet.conf (whose shortcuts now fall back to these LAN IPs when Tailscale is
# unreachable) AND the 1Password "SKYNET / Agent OS — Access Map" note.
#
# Hyper's MacBook Pro (`hyper-mbp` / hypers-macbook-pro, added 2026-10-08; its addresses are in the
# Access Map note, deliberately NOT written here — the drift guard in
# shared/scripts/test-enforce-fleet-lock-hook.sh treats any IP documented in this file as a
# spelling that must be registered) is DELIBERATELY NOT registered: it is a separate machine that
# runs no agent.
# It shares the `hyper` login, but it is not Hyper's mini and must not attribute to `hyper`. If it
# ever runs an agent, give it its own row (and a fleet-lock agent name) before touching it live.
#
# Each mini also has a Linux "KVM" tailnet peer (chips-kvm/hypers-kvm/laras-kvm) for remote
# console — deliberately NOT registered here: a KVM peer is its own separate box, not the agent's
# mini, and must stay unattributed for lock purposes.
